server:
  port: ${PORT:8080}

spring:
  application:
    name: mboa-orchestrator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mboagouvia}
    username: ${DB_USER:mboa}
    password: ${DB_PASSWORD:mboa}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # le schéma est créé par Flyway dans mboa-mcp-server
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:cle-a-renseigner}
      chat:
        model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
        max-tokens: 1024
    mcp:
      client:
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            mboa-gouvia:
              url: ${MCP_SERVER_URL:http://localhost:8081}
              endpoint: /mcp

mboa:
  jwt-secret: ${JWT_SECRET:changez-moi-cette-cle-de-developpement-32+}
  jwt-duree: 1h
  max-tentatives: 5
  duree-verrouillage: 15m
  quota-visiteur: 10
  quota-inscrit: 100
  origines-autorisees: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
