# Intégration continue : à chaque push et à chaque pull request,
# on compile, on teste (unitaires + intégration sur PostgreSQL) et on construit l'interface.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21, Maven)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mboagouvia
          POSTGRES_USER: mboa
          POSTGRES_PASSWORD: mboa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mboa -d mboagouvia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/mboagouvia
      DB_USER: mboa
      DB_PASSWORD: mboa

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler, tester et mesurer la couverture
        run: mvn -B -ntp verify

      - name: Publier les rapports de couverture JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-jacoco
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

      - name: Publier les rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  frontend:
    name: Frontend (React, Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mboa-web

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mboa-web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run lint

      - name: Lancer les tests
        run: npm test

      - name: Construire l'interface
        run: npm run build

  docker:
    name: Construire les images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Image serveur MCP
        run: docker build -f mboa-mcp-server/Dockerfile -t mboa-mcp-server:ci .
      - name: Image orchestrateur
        run: docker build -f mboa-orchestrator/Dockerfile -t mboa-orchestrator:ci .
      - name: Image web
        run: docker build -t mboa-web:ci mboa-web
