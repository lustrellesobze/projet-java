# Propose automatiquement les mises à jour de dépendances, une fois par semaine.
# Les pull requests visent develop, comme le travail de l'équipe : elles passent la CI
# et la relecture, puis arrivent sur main avec le reste du sprint.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /mboa-web
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
